name: Android CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 32-bit libraries for legacy AAPT
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6 libc6:i386 libstdc++6:i386 zlib1g:i386 || true

      - name: Set up JDK 17 for Android SDK Manager
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-23 build-tools;23.0.3'

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        env:
          SLAVE_AAPT_TIMEOUT: 60
        run: ./gradlew assembleDebug

      - name: Prepare APK Artifact
        run: |
          if [ -f app/build/outputs/apk/app-debug.apk ]; then
            cp app/build/outputs/apk/app-debug.apk 6-DOF-Kalman-Tracker.apk
          else
            find app/build/outputs/apk/ -name "*.apk" | head -n 1 | xargs -I {} cp {} 6-DOF-Kalman-Tracker.apk
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 6-DOF-Kalman-Tracker.apk
          path: 6-DOF-Kalman-Tracker.apk
