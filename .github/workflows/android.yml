name: Android CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 32-bit libraries for legacy AAPT
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y lib32z1 lib32stdc++6 libc6:i386 libstdc++6:i386 zlib1g:i386 || true

      - name: Set up JDK 17 for Android SDK Manager
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-23 build-tools;23.0.3 build-tools;34.0.0'

      - name: Set up JDK 8 for Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Unaligned APK
        env:
          SLAVE_AAPT_TIMEOUT: 60
        run: ./gradlew assembleDebug

      - name: Zipalign and Sign APK with V2/V3 Signature Schemes
        run: |
          INPUT_APK=$(find app/build/outputs/apk/ -name "*.apk" | head -n 1)
          echo "Found APK at $INPUT_APK"

          # Find zipalign and apksigner from build-tools 34.0.0
          ZIPALIGN_TOOL="/usr/local/lib/android/sdk/build-tools/34.0.0/zipalign"
          APKSIGNER_TOOL="/usr/local/lib/android/sdk/build-tools/34.0.0/apksigner"
          if [ ! -f "$ZIPALIGN_TOOL" ]; then
            ZIPALIGN_TOOL=$(which zipalign || find /usr/local/lib/android/sdk/build-tools/ -name zipalign | head -n 1)
          fi
          if [ ! -f "$APKSIGNER_TOOL" ]; then
            APKSIGNER_TOOL=$(which apksigner || find /usr/local/lib/android/sdk/build-tools/ -name apksigner | head -n 1)
          fi

          # Create debug keystore
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

          # Zipalign
          "$ZIPALIGN_TOOL" -v -p 4 "$INPUT_APK" aligned.apk

          # Sign with apksigner (supports V1, V2, V3)
          "$APKSIGNER_TOOL" sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias androiddebugkey --out 6-DOF-Kalman-Tracker.apk aligned.apk

          # Verify signature
          "$APKSIGNER_TOOL" verify --verbose 6-DOF-Kalman-Tracker.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 6-DOF-Kalman-Tracker.apk
          path: 6-DOF-Kalman-Tracker.apk
